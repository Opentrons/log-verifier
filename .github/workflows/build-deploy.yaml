name: "Build and deploy"

on:
  push:
    branches:
      - "main"
      - "release"
      - "chore_release-*"
      - "build-*"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub environment to deploy to (default applies normal branch/tag rules)"
        required: true
        type: choice
        default: default
        options:
          - default
          - prod
          - dev

env:
  CI: true

jobs:
  configure:
    name: "Choose deploy environment"
    runs-on: "ubuntu-22.04"
    outputs:
      environment: ${{ steps.choose.outputs.environment }}
    steps:
      - name: "Choose GitHub environment"
        id: "choose"
        shell: bash
        run: |
          set -euo pipefail
          manual="${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'default' }}"
          if [[ "$manual" != "default" ]]; then
            echo "environment=${manual}" >> "$GITHUB_OUTPUT"
            echo "Deploying to ${manual}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ref="${{ github.ref }}"
          if [[ "$ref" == refs/tags/v* ]] || [[ "$ref" == refs/heads/release ]] || [[ "$ref" == refs/heads/chore_release-* ]]; then
            echo "environment=prod" >> "$GITHUB_OUTPUT"
            echo "Deploying to prod" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "environment=dev" >> "$GITHUB_OUTPUT"
            echo "Deploying to dev" >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: "app build as ${{ needs.configure.outputs.environment }}"
    needs: ["configure"]
    environment: ${{ needs.configure.outputs.environment }}
    strategy:
      matrix:
        os: ["windows-2022", "ubuntu-22.04", "macos-latest"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          fetch-depth: 0
      - uses: "pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2" # v2.0.2
        with:
          cache: true
      - uses: "extractions/setup-crate@7577c1bdf2d95e6d65d532788f35ed79d4b1dda2" # v2.0.1
        with:
          repo: casey/just
          version: 1.58.0
      - name: "Setup"
        run: just setup
      - name: "Build"
        run: just build "b${{github.run_number}}"
        env:
          AZURE_TENANT_ID: ${{secrets.AZURE_TENANT_ID}}
          AZURE_CLIENT_ID: ${{secrets.AZURE_CLIENT_ID}}
          AZURE_CLIENT_SECRET: ${{secrets.AZURE_CLIENT_SECRET}}
          CSC_LINK: ${{ secrets.OT_APP_CSC_MACOS }}
          CSC_KEY_PASSWORD: ${{ secrets.OT_APP_CSC_KEY_MACOS }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.OT_APP_APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.OT_APP_APPLE_TEAM_ID }}
      - name: "Upload artifact"
        id: "artifact-upload"
        uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
        with:
          name: "logverifier-${{matrix.os}}-${{github.run_id}}"
          path: "app-shell/dist/*"
      - name: "Artifact result"
        run: echo "Artifact is ${{ steps.artifact-upload.outputs.artifact-url }}"

  deploy:
    name: "Deploy artifacts to S3 ${{ needs.configure.outputs.environment }}"
    needs: ["configure", "build"]
    if: vars.OT_LOGVERIFIER_DEPLOY_ROLE != ''
    runs-on: "ubuntu-22.04"
    environment: ${{ needs.configure.outputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: "Checkout release scripts"
        if: startsWith(github.ref, 'refs/tags/v')
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
      - name: "Resolve S3 destination"
        id: "target"
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ vars.DEPLOY_PREFIX_BUILDID }}" == "true" ]]; then
            echo "prefix=${{ vars.DEPLOY_PREFIX_BASE }}/${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "prefix=${{ vars.DEPLOY_PREFIX_BASE }}" >> "$GITHUB_OUTPUT"
          fi
          echo "bucket=${{ vars.DEPLOY_BUCKET }}" >> "$GITHUB_OUTPUT"

          if [[ "${{ needs.configure.outputs.environment }}" == "prod" ]]; then
            echo "invalidate=true" >> "$GITHUB_OUTPUT"
          else
            echo "invalidate=false" >> "$GITHUB_OUTPUT"
          fi
      - name: "Download build artifacts"
        uses: "actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131" # v7.0.0
        with:
          pattern: "logverifier-*"
          path: "artifacts"
          merge-multiple: true
      - name: "Stage installer files"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p to_upload
          find artifacts -type f \( \
            -name '*.msi' \
            -o -name '*.dmg' \
            -o -name '*.zip' \
            -o -name '*.AppImage' \
            -o -name '*.blockmap' \
          \) -exec cp -v {} to_upload/ \;
          echo "Staged:"
          ls -la to_upload
      - name: "Configure AWS credentials (GitHub OIDC)"
        uses: "aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a" # v4.3.1
        with:
          role-to-assume: ${{ vars.OT_LOGVERIFIER_DEPLOY_ROLE }}
          aws-region: us-east-1
      - name: "Sync artifacts to S3"
        run: |
          aws s3 sync --acl=public-read to_upload/ \
            "s3://${{ steps.target.outputs.bucket }}/${{ steps.target.outputs.prefix }}"
      - name: "Write download links summary"
        shell: bash
        run: |
          set -euo pipefail
          bucket="${{ steps.target.outputs.bucket }}"
          prefix="${{ steps.target.outputs.prefix }}"
          base_url="https://${bucket}/${prefix}"

          {
            echo "## Deployed artifacts"
            echo ""
            echo "Environment: \`${{ needs.configure.outputs.environment }}\`"
            echo ""
            echo "| File | URL |"
            echo "| --- | --- |"
            for filepath in to_upload/*; do
              [[ -f "$filepath" ]] || continue
              filename="$(basename "$filepath")"
              encoded="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$filename")"
              url="${base_url}/${encoded}"
              # Escape pipe chars in markdown cells; keep the href copy-pastable
              display_name="${filename//|/\\|}"
              echo "| \`${display_name}\` | [\`${url}\`](${url}) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: "astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7" # v10.2.0
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          version: "0.12.23"
      - name: "Publish releases.json"
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          uv run scripts/releases.py update \
            --bucket "${{ steps.target.outputs.bucket }}" \
            --prefix "${{ steps.target.outputs.prefix }}" \
            --version "${GITHUB_REF_NAME#v}" \
            --artifact-dir ./to_upload
      - name: "Invalidate CloudFront cache (builds.opentrons.com)"
        if: steps.target.outputs.invalidate == 'true' && vars.OT_LOGVERIFIER_BUILDS_CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          set -euo pipefail
          INVALIDATION_ID="$(
            aws cloudfront create-invalidation \
              --distribution-id '${{ vars.OT_LOGVERIFIER_BUILDS_CLOUDFRONT_DISTRIBUTION_ID }}' \
              --paths '/${{ steps.target.outputs.prefix }}/*' \
              --output text \
              --query 'Invalidation.Id'
          )"
          echo "Started CloudFront invalidation: ${INVALIDATION_ID}"
