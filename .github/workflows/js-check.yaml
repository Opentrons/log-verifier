name: "JS checks"

on:
  pull_request:
    paths:
      - "**.js"
      - "**.cjs"
      - "**.mjs"
      - "**.ts"
      - "**.cts"
      - "**.mts"
      - "**.tsx"
      - "**.json"
      - "**.css"
      - "**.md"
      - "**.py"
      - ".github/workflows/js-check.yaml"
  push:
    paths:
      - "**.js"
      - "**.cjs"
      - "**.mjs"
      - "**.ts"
      - "**.cts"
      - "**.mts"
      - "**.tsx"
      - "**.json"
      - "**.css"
      - "**.md"
      - "**.py"
      - ".github/workflows/js-check.yaml"
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  CI: true

jobs:
  checks:
    name: "js-checks"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
      - uses: "pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4" # v3.1.1
        with:
          cache: true
      - uses: "extractions/setup-crate@7577c1bdf2d95e6d65d532788f35ed79d4b1dda2" # v2.0.1
        with:
          repo: casey/just
          version: 1.58.0
      - name: "Setup"
        run: just setup
      - name: "Format-check"
        run: just format-check
      - name: "Type-aware linting"
        run: just lint
  tests:
    name: "js-tests-${{matrix.target_dir}}-${{matrix.os}}"
    strategy:
      matrix:
        os: ["windows-2022", "ubuntu-22.04", "macos-latest"]
        target_dir: ["app", "app-shell"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          fetch-depth: 0
      - uses: "pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4" # v3.1.1
        with:
          cache: true
      - uses: "extractions/setup-crate@7577c1bdf2d95e6d65d532788f35ed79d4b1dda2" # v2.0.1
        with:
          repo: casey/just
          version: 1.58.0
      - name: "Setup"
        run: just setup
      - name: "Test"
        run: just test ${{ matrix.target_dir }}
  release-scripts:
    name: "release-scripts"
    runs-on: "ubuntu-22.04"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
      - uses: "astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa" # v10.3.1
        with:
          version: "0.12.23"
      - name: "Test"
        run: uv run --no-project --isolated --with-requirements scripts/releases.py --with-requirements scripts/test_releases.py pytest scripts
