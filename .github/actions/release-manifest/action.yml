name: "Update release manifest"
description: "Activate or revoke the latest production release and refresh the stable download links."
inputs:
  command:
    description: "activate or revoke"
    required: true
  deploy-role:
    description: "IAM role ARN to assume via GitHub OIDC"
    required: true
  deploy-bucket:
    description: "S3 bucket that hosts releases.json and installers"
    required: true
  deploy-prefix:
    description: "S3 key prefix for releases.json and stable links"
    required: true
  distribution-id:
    description: "Optional CloudFront distribution ID to invalidate"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: "Configure AWS credentials (GitHub OIDC)"
      uses: "aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a" # v4.3.1
      with:
        role-to-assume: ${{ inputs.deploy-role }}
        aws-region: us-east-1
    - uses: "astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7" # v10.2.0
      with:
        version: "0.12.23"
    - name: "Update releases.json and stable links"
      shell: bash
      run: |
        set -euo pipefail
        case "${{ inputs.command }}" in
          activate|revoke) ;;
          *)
            echo "command must be activate or revoke" >&2
            exit 1
            ;;
        esac
        uv run scripts/releases.py "${{ inputs.command }}" \
          --bucket "${{ inputs.deploy-bucket }}" \
          --prefix "${{ inputs.deploy-prefix }}" \
          --distribution-id "${{ inputs.distribution-id }}"
